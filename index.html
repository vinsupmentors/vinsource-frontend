<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/vinsup-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vin-Source Portal</title>
    <meta name="description" content="Vinsup Skill Academy — HR & Operations Portal" />
    <script>
      // Dark mode is disabled app-wide (light mode only) — see Header.tsx.
      // This clears any 'dark' class a stale build may have applied and
      // wipes any previously-saved preference so nothing lingers.
      (function () {
        document.documentElement.classList.remove('dark');
        try { localStorage.removeItem('theme'); } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
